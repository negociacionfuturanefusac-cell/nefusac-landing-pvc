name: Desplegar en GitHub Pages

# La landing es HTML estatico: no hay build, se publica el repo tal cual.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya esta corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Sin enablement: la app de GitHub de la sesion no tiene permiso para
      # CREAR el sitio de Pages ("Resource not accessible by integration"), asi
      # que Pages se activa una unica vez a mano en Settings > Pages eligiendo
      # Source: GitHub Actions. Desplegar sobre un sitio ya activo si funciona.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
